# Production destination overrides (`kamal <cmd> -d production`).
# Owns the single shared `forum-postgres` PostgreSQL 18 accessory container
# (bootstrapped with the dedicated `forum_admin` superuser) and the `forum-rustfs`
# object-storage accessory container on the Unraid host. Production app containers
# authenticate as the non-superuser `forum_production` role (created by
# `docker/postgres/init-staging.sh`). Traffic reaches `web` and `reverb`
# exclusively through the shared `kamal-proxy` container routed by Host.
image: sgb999/forum-laravel-inertia-vue-production

proxy:
  host: <%= ENV.fetch("FORUM_HOST", "forum.example.com") %>

env:
  clear:
    DB_DATABASE: forum_production
    DB_USERNAME: forum_production

volumes:
  - "forum_production_storage:/var/www/html/storage"

accessories:
  postgres:
    image: postgres:18
    host: <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: postgres
        POSTGRES_USER: forum_admin
      secret:
        - POSTGRES_PASSWORD
        - PRODUCTION_DB_PASSWORD
        - STAGING_DB_PASSWORD
    files:
      - docker/postgres/init-staging.sh:/usr/local/bin/init-staging.sh
    directories:
      - data:/var/lib/postgresql
  rustfs:
    image: rustfs/rustfs:latest
    host: <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    port: "127.0.0.1:9000:9000"
    env:
      clear:
        RUSTFS_VOLUMES: /data
        RUSTFS_ADDRESS: 0.0.0.0:9000
        RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
        RUSTFS_CONSOLE_ENABLE: "true"
      secret:
        - RUSTFS_ACCESS_KEY
        - RUSTFS_SECRET_KEY
    directories:
      - data:/data
