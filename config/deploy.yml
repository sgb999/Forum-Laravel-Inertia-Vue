# Name of your application. Used to uniquely identify containers.
service: forum

# Name of the container image.
image: sgb999/forum-laravel-inertia-vue

# Deploy to these servers.
servers:
  web:
    hosts:
      - <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
  worker:
    hosts:
      - <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    # No --force: during any future maintenance window (including a schema
    # migration not yet applied), this standing process should idle rather
    # than process jobs against a database it can't be sure is ready. A
    # cutover or similar one-off drain uses its own
    # `queue:work --force --stop-when-empty` run manually (see README), not
    # this role's cmd.
    cmd: php artisan queue:work database --tries=3 --backoff=3
  scheduler:
    hosts:
      - <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    cmd: php artisan schedule:work
  reverb:
    hosts:
      - <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    cmd: php artisan reverb:start --host=0.0.0.0 --port=8080

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
proxy:
  ssl: false
  app_port: 80
  healthcheck:
    path: /up
    interval: 3

# Credentials for your image host.
registry:
  server: ghcr.io
  username: sgb999
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    APP_NAME: Forum
    APP_ENV: production
    APP_DEBUG: "false"
    LOG_CHANNEL: stderr
    LOG_LEVEL: info
    DB_CONNECTION: pgsql
    DB_HOST: forum-postgres
    DB_PORT: "5432"
    DB_DATABASE: laravel
    DB_USERNAME: laravel
    BROADCAST_DRIVER: reverb
    CACHE_DRIVER: database
    FILESYSTEM_DISK: public
    MEDIA_DISK: public
    QUEUE_CONNECTION: database
    SESSION_DRIVER: database
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8080"
  secret:
    - APP_KEY
    - APP_URL
    - DB_PASSWORD
    - REVERB_APP_ID
    - REVERB_APP_KEY
    - REVERB_APP_SECRET
    - REVERB_HOST
    - REVERB_PORT
    - REVERB_SCHEME
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - AWS_DEFAULT_REGION
    - AWS_BUCKET
    - AWS_ENDPOINT
    - AWS_USE_PATH_STYLE_ENDPOINT

# Aliases are triggered with "bin/kamal <alias>".
aliases:
  console: app exec --interactive --reuse "php artisan tinker"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  artisan: app exec --interactive --reuse "php artisan"

# Persistent storage volume for uploaded media and framework state across deploys.
volumes:
  - "forum_storage:/var/www/html/storage"

# Bridge fingerprinted Vite assets between versions to avoid 404s on in-flight requests.
asset_path: /var/www/html/public/build

# Configure the image builder.
builder:
  arch: amd64
  dockerfile: docker/php/Dockerfile
  target: production

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  postgres:
    image: postgres:18
    host: <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: laravel
        POSTGRES_USER: laravel
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql
  rustfs:
    image: rustfs/rustfs:latest
    host: <%= ENV.fetch("KAMAL_DEPLOY_HOST", "127.0.0.1") %>
    port: "127.0.0.1:9000:9000"
    env:
      clear:
        RUSTFS_VOLUMES: /data
        RUSTFS_ADDRESS: 0.0.0.0:9000
        RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
        RUSTFS_CONSOLE_ENABLE: "true"
      secret:
        - RUSTFS_ACCESS_KEY
        - RUSTFS_SECRET_KEY
    directories:
      - data:/data
