name: laravel

x-app-build: &app-build
  context: .
  dockerfile: docker/php/Dockerfile
  target: development

x-app-image: &app-image laravel-app:dev

x-app-env: &app-env
  env_file:
    - .env

services:
  app:
    build: *app-build
    image: *app-image
    <<: *app-env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: php-fpm && php artisan migrate
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_started
    networks: [laravel]

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks: [laravel]

  # Vite dev server for HMR. Only used in local dev - the production image
  # builds static assets at image-build time instead (see Dockerfile).
  vite:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: frontend-dev
    <<: *app-env
    working_dir: /var/www/html
    command: sh -c "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    networks: [laravel]

  mysql:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [laravel]

  valkey:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    ports:
      - "${FORWARD_VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [laravel]

  reverb:
    build: *app-build
    image: *app-image
    <<: *app-env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_PORT:-8080}:8080"
    depends_on:
      - app
    networks: [laravel]

  queue:
    build: *app-build
    image: *app-image
    <<: *app-env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: php artisan queue:work redis --tries=3 --backoff=3
    restart: unless-stopped
    depends_on:
      - app
      - valkey
    networks: [laravel]

  scheduler:
    build: *app-build
    image: *app-image
    <<: *app-env
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    entrypoint: ["/bin/sh", "-c"]
    command: ["while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"]
    restart: unless-stopped
    depends_on:
      - app
    networks: [laravel]

  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    ports:
      - "${FORWARD_RUSTFS_PORT:-9000}:9000"   # S3 API
      - "${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - rustfs-data:/data
    networks: [laravel]

networks:
  laravel:
    driver: bridge

volumes:
  vendor:
  node-modules:
  pnpm-store:
  mysql-data:
  valkey-data:
  rustfs-data:
