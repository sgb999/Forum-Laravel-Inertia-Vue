name: laravel

x-app-build: &app-build
    context: .
    dockerfile: docker/php/Dockerfile
    target: development

x-app-image: &app-image laravel-app:dev

x-app-env: &app-env
    env_file:
        - .env

services:
    app:
        build: *app-build
        image: *app-image
        <<: *app-env
        volumes:
            - .:/var/www/html
        command: php-fpm
        depends_on:
            postgres:
                condition: service_healthy
        networks: [laravel]

    nginx:
        image: nginx:alpine
        ports:
            - "${APP_PORT:-80}:80"
        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        networks: [laravel]

    # Vite dev server for HMR. Only used in local dev - the production image
    # builds static assets at image-build time instead (see Dockerfile).
    vite:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: frontend-dev
        <<: *app-env
        working_dir: /var/www/html
        command: sh -c "pnpm install --frozen-lockfile && pnpm run dev -- --host 0.0.0.0"
        ports:
            - "${VITE_PORT:-5173}:5173"
        volumes:
            - .:/var/www/html
            - pnpm-store:/root/.local/share/pnpm/store
        networks: [laravel]

    # Pest browser tests. Debian-based because Playwright's Chromium has no
    # musl build; host networking lets Chromium reach the Vite dev server.
    browser:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: browser
        <<: *app-env
        network_mode: host
        user: "${BROWSER_UID:-1000}:${BROWSER_GID:-1000}"
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        profiles: [testing]

    # Postgres 18 is the database and also the cache, session and queue store.
    postgres:
        image: postgres:18
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-laravel}
            POSTGRES_USER: ${DB_USERNAME:-laravel}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
        ports:
            - "${FORWARD_DB_PORT:-5432}:5432"
        volumes:
            # Postgres 18 images keep data under /var/lib/postgresql/18; mount the parent.
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 30s
        networks: [laravel]

    reverb:
        build: *app-build
        image: *app-image
        <<: *app-env
        volumes:
            - .:/var/www/html
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - "${REVERB_PORT:-8080}:8080"
        depends_on:
            - app
        networks: [laravel]

    queue:
        build: *app-build
        image: *app-image
        <<: *app-env
        volumes:
            - .:/var/www/html
        command: php artisan queue:work database --tries=3 --backoff=3
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        networks: [laravel]

    scheduler:
        build: *app-build
        image: *app-image
        <<: *app-env
        volumes:
            - .:/var/www/html
        command: php artisan schedule:work
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        networks: [laravel]

    rustfs:
        image: rustfs/rustfs:latest
        restart: unless-stopped
        environment:
            RUSTFS_VOLUMES: /data
            RUSTFS_ADDRESS: 0.0.0.0:9000
            RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
            RUSTFS_CONSOLE_ENABLE: "true"
            RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
            RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
        ports:
            - "${FORWARD_RUSTFS_PORT:-9000}:9000"   # S3 API
            - "${FORWARD_RUSTFS_CONSOLE_PORT:-9001}:9001" # Web console
        volumes:
            - rustfs-data:/data
        networks: [laravel]

networks:
    laravel:
        driver: bridge

volumes:
    pnpm-store:
    postgres-data:
    rustfs-data:
