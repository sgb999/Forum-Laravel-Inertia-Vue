; General
memory_limit = 512M
max_execution_time = 120
max_input_time = 120
post_max_size = 100M
upload_max_filesize = 100M
max_file_uploads = 20

; Timezone
date.timezone = UTC

; Error handling (tune down for production via env override if you like)
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

; Realpath cache (helps Laravel's autoloader under FPM)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Sessions - handled by Laravel/Valkey, disable native PHP session cookie GC noise
session.gc_probability = 0
